<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>到此一游 · 点位</title>
<link rel="stylesheet" href="/theme/app.css">
<script src="guard.js"></script>
<style>
body{background:#E7E1D6;padding:0 0 40px}
.wrap{max-width:430px;margin:0 auto;background:var(--bg);min-height:100dvh;overflow:hidden}
.topbar.home{border-bottom:1px solid var(--hair)}
.code{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;color:var(--ink3)}
.hero3{height:150px;position:relative;overflow:hidden}
.hero3 .cap{position:absolute;left:14px;bottom:12px;color:#fff;font-size:15px;font-weight:800;
  text-shadow:0 2px 10px rgba(12,10,26,.7);z-index:2}
.bigseq{font-size:44px;font-weight:900;letter-spacing:-2px;line-height:1;color:var(--coral)}
.skel{background:linear-gradient(90deg,#EFEAE0,#F7F3EC,#EFEAE0);border-radius:10px;height:16px;margin:10px 0}
.errbox{background:var(--coral-bg);border-left:4px solid var(--coral);border-radius:12px;padding:14px;font-size:13px}
.trk2{background:#fff;border-radius:18px;padding:12px;box-shadow:var(--shadow);margin-bottom:12px}
.trk2 svg{display:block;width:100%;height:200px}
.segline{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--hair);font-size:12.5px}
.segline:last-child{border-bottom:none}
.sq{width:10px;height:10px;border-radius:3px;flex:0 0 auto}
.ntrole{font-style:normal;background:var(--blue);color:#fff;border-radius:5px;padding:1px 5px;
  font-size:9.5px;font-weight:700}
.cmacts{display:flex;gap:16px;margin-top:9px;font-size:12px;align-items:center}
.cmacts button{font-weight:700;color:var(--ink3)}
.cmacts button.on{color:var(--coral)}
.cmacts button.onbad{color:var(--amber-ink)}
.cmnote{color:var(--amber-ink);font-weight:700;font-size:11px}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar home" style="padding:16px">
    <span class="brand"><b>到此一游</b><em>For all hikers</em></span>
  </div>
  <div id="view" style="padding:0 16px 24px">
    <div class="skel" style="width:60%;height:22px"></div>
    <div class="skel" style="width:40%"></div>
    <div class="skel" style="height:150px;border-radius:18px"></div>
  </div>
</div>
<script>
var COLORS = { easy: '#2563EB', mid: '#F2B62C', hard: '#E4453A', hidden: '#22242E' };
var NAMES = { easy: '简单', mid: '中等', hard: '困难', hidden: '隐藏' };
var KIND = { climb: '爬升', desc: '下降', flat: '平缓' };
var SHAPE = {
  easy: function (c) { return '<circle cx="50" cy="50" r="41" fill="' + c + '"/>'; },
  mid: function (c) { return '<polygon points="50,10 92,87 8,87" fill="' + c + '"/>'; },
  hard: function (c) { return '<polygon points="50,6 94,50 50,94 6,50" fill="' + c + '"/>'; },
  hidden: function (c) { return '<polygon points="50,5 89,27 89,73 50,95 11,73 11,27" fill="' + c + '"/>'; }
};
function badge(lv) {
  var c = COLORS[lv] || '#22242E';
  return '<span class="badge" style="background:' + c + '22;color:' + c + '">' +
    '<span class="lvmark"><span class="lvshape">' +
    '<svg viewBox="0 0 100 100">' + SHAPE[lv](c) + '</svg></span>' + (NAMES[lv] || lv) +
    '</span></span>';
}
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
  return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function scene(seed) {
  var h = 0; for (var i = 0; i < seed.length; i++) h = (h * 31 + seed.charCodeAt(i)) % 997;
  var pal = [
    ['#FFE9C8', '#FFD09A', '#F4A97E', '#C4869A', '#6E6394'],
    ['#EAF2F8', '#D3E2EC', '#AEC3D6', '#8897B2', '#5E6C8C'],
    ['#EDF4E7', '#D6E7CC', '#B2CCA4', '#89A87E', '#628067']
  ][h % 3];
  var uid = 'g' + h, out = '<svg viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice">';
  out += '<defs><linearGradient id="' + uid + '" x1="0" y1="0" x2="0" y2="1">';
  pal.forEach(function (c, i) { out += '<stop offset="' + (i * 25) + '%" stop-color="' + c + '"/>'; });
  out += '</linearGradient></defs><rect width="400" height="300" fill="url(#' + uid + ')"/>';
  out += '<circle cx="270" cy="90" r="26" fill="#FFE0A0" opacity=".9"/>';
  out += '<path d="M0 300 L0 180 L70 120 L140 190 L210 130 L290 200 L400 150 L400 300Z" fill="#524C72" opacity=".85"/>';
  out += '<path d="M0 300 L0 230 L90 190 L180 245 L280 195 L400 250 L400 300Z" fill="#33304A"/>';
  return out + '</svg>';
}
function trackSVG(path, segs, km, peaks) {
  var W = 380, H = 200, pad = 24, xs = [], ys = [];
  path.forEach(function (p) { xs.push(p[0]); ys.push(p[1]); });
  var x0 = Math.min.apply(null, xs), x1 = Math.max.apply(null, xs);
  var y0 = Math.min.apply(null, ys), y1 = Math.max.apply(null, ys);
  var s = Math.min((W - pad * 2) / ((x1 - x0) || 1), (H - pad * 2) / ((y1 - y0) || 1));
  var ox = (W - (x1 - x0) * s) / 2, oy = (H - (y1 - y0) * s) / 2;
  function P(i) { return [(xs[i] - x0) * s + ox, (ys[i] - y0) * s + oy]; }
  var n = path.length - 1, out = '<svg viewBox="0 0 ' + W + ' ' + H + '">';
  out += '<g fill="none" stroke="#EFEADD" stroke-width="1">';
  [40, 78, 116, 154].forEach(function (y) { out += '<path d="M0 ' + y + ' q 70 -12 140 0 t 200 0"/>'; });
  out += '</g>';
  segs.forEach(function (sg) {
    var a = Math.round(sg.from_km / km * n), b = Math.round(sg.to_km / km * n), d = '';
    for (var i = a; i <= b; i++) { var q = P(i); d += (i === a ? 'M' : 'L') + q[0].toFixed(1) + ' ' + q[1].toFixed(1); }
    out += '<path d="' + d + '" fill="none" stroke="' + (COLORS[sg.level] || '#888') +
      '" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>';
  });
  (peaks || []).forEach(function (p) {
    var q = P(Math.round(p.km / km * n));
    out += '<circle cx="' + q[0].toFixed(1) + '" cy="' + q[1].toFixed(1) + '" r="7" fill="#22242E"/>' +
      '<text x="' + q[0].toFixed(1) + '" y="' + (q[1] - 11).toFixed(1) + '" text-anchor="middle" ' +
      'font-size="11" font-weight="700" fill="#22242E">' + p.altitude + '</text>';
  });
  return out + '</svg>';
}
async function j(url, opt) {
  var r = await fetch(url, opt);
  if (!r.ok) {
    var errBody = await r.json().catch(function () { return {}; });
    var error = new Error(errBody.detail ? JSON.stringify(errBody.detail) : r.status);
    error.status = r.status;
    throw error;
  }
  return r.json();
}
(async function () {
  var v = document.getElementById('view');
  var code = (new URLSearchParams(location.search).get('code') || '').trim().toUpperCase();
  if (!code) {
    v.innerHTML = '<div class="errbox"><b>没有识别到点位</b><br>请使用标牌二维码，或检查链接里的点位编号。</div>';
    return;
  }
  try {
    var p = await j('/api/points/' + code);
    var route = p.route_id && p.route_slug
      ? await j('/api/routes/' + encodeURIComponent(p.route_slug)) : null;

    v.innerHTML =
      '<div class="hero3" style="margin:0 -16px">' + scene(p.code) +
      '<span class="cap">' + esc(p.name) + ' · 海拔 ' + (p.altitude || '—') + ' m</span></div>' +
      '<div style="margin-top:14px">' +
      '<div class="code">' + esc(p.code) + ' · ' + esc(p.type) + '</div>' +
      '<h2 style="font-size:23px;font-weight:900;letter-spacing:-.6px;margin:4px 0 6px">你到了，山友。</h2>' +
      '<div class="muted" style="font-size:13px;margin-bottom:14px">' +
      (p.route_name ? '属于「' + esc(p.route_name) + '」' : '') +
      ' · 已有 ' + p.visitCount + ' 人在这里留下痕迹</div>' +
      '<div class="card" style="text-align:center">' +
      '<div class="bigseq" id="seq">我到了</div>' +
      '<div class="muted tiny" style="margin:8px 0 14px">打卡后生成本次到访凭证</div>' +
      '<button class="btn coral" id="ck">留下我的打卡</button>' +
      '<div id="ckmsg" class="tiny" style="margin-top:10px;color:var(--blue)"></div></div>' +

      (p.topComment
        ? '<div class="letter"><span class="stampmark"></span><div class="ltag">有人给你留了一句话</div>' +
          '<div class="line" style="font-size:15px">' + esc(p.topComment.text) + '</div>' +
          '<div class="lsub">' + esc(p.topComment.nickname || '山友') + ' 留在这里</div></div>'
        : '') +

      '<div class="sec-head"><h3>留言</h3><span class="more" id="cmcount"></span></div>' +
      '<div id="cmlist"><div class="skel"></div></div>' +
      '<div class="card" style="padding:14px">' +
      '<textarea id="cminput" rows="2" maxlength="200" placeholder="写一句给下一位（最多 200 字）" ' +
      'style="width:100%;border:1.5px solid var(--line);border-radius:12px;padding:11px;' +
      'font:inherit;font-size:14px;resize:none;outline:none;background:#fff"></textarea>' +
      '<div style="display:flex;align-items:center;gap:10px;margin-top:10px">' +
      '<span class="tiny muted" id="cmhint">先保存为草稿；注册 / 登录后可署名发布</span>' +
      '<button class="btn coral" id="cmsend" style="width:auto;margin-left:auto;' +
      'padding:10px 22px;font-size:14px">保存草稿</button></div></div>' +
      '<div class="card" style="padding:14px;margin-top:12px">' +
      '<label for="privateNote" style="display:block;font-weight:800;margin-bottom:8px">私人纪念</label>' +
      '<textarea id="privateNote" rows="2" maxlength="500" placeholder="只留给自己，不会公开" ' +
      'style="width:100%;border:1.5px solid var(--line);border-radius:12px;padding:11px;' +
      'font:inherit;font-size:14px;resize:none;outline:none;background:#fff"></textarea>' +
      '<div style="display:flex;align-items:center;gap:10px;margin-top:10px">' +
      '<span class="tiny muted" id="privateHint">最多 500 字，仅自己可见</span>' +
      '<button class="btn ghost" id="privateSave" style="width:auto;margin-left:auto;' +
      'padding:10px 16px;font-size:14px">保存纪念</button></div></div>' +
      '<button class="btn blue" id="accountPrompt" style="margin-top:12px">注册 / 登录并保存到账号</button>' +
      '<div class="card" id="accountBox" style="display:none;padding:14px;margin-top:12px">' +
      '<div style="display:flex;gap:8px;margin-bottom:12px">' +
      '<button class="btn coral" id="registerMode" aria-pressed="true" style="flex:1">注册</button>' +
      '<button class="btn ghost" id="loginMode" aria-pressed="false" style="flex:1">登录</button></div>' +
      '<label style="display:block;font-size:12px;font-weight:700;margin:8px 0 5px">用户名</label>' +
      '<input id="authUsername" autocomplete="username" maxlength="32" placeholder="3–32 位字母、数字或下划线" ' +
      'style="width:100%;border:1px solid var(--line);border-radius:10px;padding:11px;font:inherit">' +
      '<label id="authEmailLabel" style="display:block;font-size:12px;font-weight:700;margin:8px 0 5px">邮箱（可选）</label>' +
      '<input id="authEmail" type="email" autocomplete="email" maxlength="254" placeholder="用于后续找回账号" ' +
      'style="width:100%;border:1px solid var(--line);border-radius:10px;padding:11px;font:inherit">' +
      '<label id="authNicknameLabel" style="display:block;font-size:12px;font-weight:700;margin:8px 0 5px">显示称呼（可选）</label>' +
      '<input id="authNickname" maxlength="32" placeholder="留言时显示的称呼" ' +
      'style="width:100%;border:1px solid var(--line);border-radius:10px;padding:11px;font:inherit">' +
      '<label style="display:block;font-size:12px;font-weight:700;margin:8px 0 5px">密码（至少 12 位）</label>' +
      '<input id="authPassword" type="password" autocomplete="new-password" maxlength="128" ' +
      'style="width:100%;border:1px solid var(--line);border-radius:10px;padding:11px;font:inherit">' +
      '<button class="btn coral" id="authSubmit" style="margin-top:12px">创建账号并合并记录</button>' +
      '<div id="authMessage" class="tiny muted" style="margin-top:9px"></div>' +
      '<button class="btn ghost" id="publishDraft" style="display:none;margin-top:10px">发布这条留言</button>' +
      '</div>' +

      (route
        ? '<div class="sec-head"><h3>' + esc(route.name) + '</h3>' +
          '<span class="more">' + route.km + ' km · ↗ ' + route.up + ' m</span></div>' +
          '<div class="hint" style="margin-top:-6px">' + badge(route.hardest_level) +
          ' ' + route.peaks.length + ' 个山顶 · ' + route.segments.length + ' 段 · 数据来自数据库</div>' +
          '<div class="trk2">' + trackSVG(route.path, route.segments, route.km, route.peaks) + '</div>' +
          '<div class="card" style="padding:6px 14px">' +
          route.segments.map(function (s) {
            return '<div class="segline"><span class="sq" style="background:' + COLORS[s.level] + '"></span>' +
              '<span style="font-weight:800;flex:0 0 52px">' + s.no + '. ' + KIND[s.kind] + '</span>' +
              '<span class="muted" style="flex:0 0 96px">' + s.from_km + '–' + s.to_km + ' km</span>' +
              '<span style="flex:1;color:var(--ink2)">' + (s.rise > 0 ? '+' : '') + s.rise +
              ' m · ' + (s.pct > 0 ? '+' : '') + s.pct + '%</span>' +
              badge(s.level) + '</div>';
          }).join('') + '</div>'
        : '') +
      '</div>';

    function guestToken() {
      var key = 'hikes.guest.token', saved = null;
      try { saved = localStorage.getItem(key); } catch (e) { }
      if (saved) return Promise.resolve(saved);
      return j('/api/guest', { method: 'POST' }).then(function (d) {
        try { localStorage.setItem(key, d.token); } catch (e) { }
        return d.token;
      });
    }
    var userToken = null;
    try { userToken = localStorage.getItem('hikes.auth.token'); } catch (e) { }
    function accountHeaders() {
      return { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + userToken };
    }
    function showPublishAction() {
      document.getElementById('publishDraft').style.display = 'block';
    }
    function loadAccountDraft() {
      if (!userToken) return Promise.resolve();
      return j('/api/me/arrival-drafts', { headers: accountHeaders() }).then(function (drafts) {
        var d = drafts.find(function (item) { return item.code === p.code; });
        if (!d) return;
        if (d.privateNote && !document.getElementById('privateNote').value)
          document.getElementById('privateNote').value = d.privateNote;
        if (d.publicCommentDraft) {
          document.getElementById('cminput').value = d.publicCommentDraft;
          showPublishAction();
        }
      }).catch(function (e) {
        if (e.status !== 401) return;
        userToken = null;
        try { localStorage.removeItem('hikes.auth.token'); } catch (e2) { }
        document.getElementById('accountBox').style.display = 'none';
        document.getElementById('accountPrompt').textContent = '登录已过期 · 注册 / 登录并保存到账号';
      });
    }
    guestToken().then(function (guest) {
      return j('/api/guest/arrival-draft?code=' + encodeURIComponent(p.code), {
        headers: { 'X-Guest-Token': guest }
      });
    }).then(function (draft) {
      if (draft.privateNote && !document.getElementById('privateNote').value)
        document.getElementById('privateNote').value = draft.privateNote;
      if (draft.publicCommentDraft && !document.getElementById('cminput').value)
        document.getElementById('cminput').value = draft.publicCommentDraft;
    }).catch(function () { });
    loadAccountDraft();
    document.getElementById('ck').onclick = async function () {
      var btn = this;
      btn.disabled = true;
      try {
        var guest = await guestToken();
        var r = await j('/api/guest/visit', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-Guest-Token': guest },
          body: JSON.stringify({ code: p.code, source: 'scan' })
        });
        if (userToken) {
          await j('/api/me/merge-guest', { method: 'POST', headers: {
            'Authorization': 'Bearer ' + userToken,
            'X-Guest-Token': guest
          } });
          try { localStorage.removeItem('hikes.guest.token'); } catch (e) { }
        }
        document.getElementById('seq').textContent = '第 ' + r.seq + ' 位';
        document.getElementById('ckmsg').textContent =
          new Date(r.visitedAt).toLocaleString('zh-CN') + (r.isFirstToday ? ' · 到访凭证已生成' : ' · 今天已打卡，凭证已恢复');
        btn.textContent = r.isFirstToday ? '已打卡' : '查看我的凭证';
      } catch (e) {
        btn.disabled = false;
        btn.textContent = '打卡失败，重试';
        document.getElementById('ckmsg').textContent = String(e.message).slice(0, 120);
      }
    };

    /* ---------------- 留言 ---------------- */
    var H = { 'Content-Type': 'application/json' };
    function fmt(iso) {
      var m = Math.round((new Date() - new Date(iso)) / 60000);
      if (m < 1) return '刚刚';
      if (m < 60) return m + ' 分钟前';
      if (m < 1440) return Math.round(m / 60) + ' 小时前';
      return Math.round(m / 1440) + ' 天前';
    }
    async function loadComments() {
      var list = await j('/api/points/' + p.id + '/comments');
      document.getElementById('cmcount').textContent = list.items.length ? list.items.length + ' 条' : '';
      var box = document.getElementById('cmlist');
      if (!list.items.length) {
        box.innerHTML = '<div class="card muted tiny">还没有人在这里留言，做第一个。</div>';
        return;
      }
      box.innerHTML = list.items.map(function (c) {
        var flagged = c.status === 'flagged';
        return '<div class="comment"' + (flagged ? ' style="opacity:.55"' : '') + '>' +
          '<div class="ph">' + esc(c.nickname || '山友') +
          (c.is_maintainer ? ' <span class="ntrole">维护人</span>' : '') +
          '<span style="margin-left:auto">' + fmt(c.created_at) + '</span></div>' +
          '<p>' + esc(c.text) + '</p><div class="cmacts">' +
          '<button data-v="like" data-c="' + c.id + '" class="' + (c.like_count ? 'on' : '') + '">♥ ' + c.like_count + '</button>' +
          '<button data-v="bad" data-c="' + c.id + '" class="' + (c.bad_count ? 'onbad' : '') + '">✕ ' + c.bad_count + '</button>' +
          (flagged ? '<span class="cmnote">' + c.bad_count + ' 人认为这条已经不准了</span>' : '') +
          '</div></div>';
      }).join('');
      box.querySelectorAll('[data-v]').forEach(function (b) {
        if (!userToken) {
          b.disabled = true;
          b.title = '注册后可参与互动';
          return;
        }
        b.onclick = async function () {
          b.disabled = true;
          try {
            await j('/api/comments/' + b.dataset.c + '/vote',
              { method: 'POST', headers: accountHeaders(), body: JSON.stringify({ value: b.dataset.v }) });
            await loadComments();
          } catch (e) { b.disabled = false; }
        };
      });
    }
    document.getElementById('cmsend').onclick = async function () {
      var el = document.getElementById('cminput'), t = el.value.trim();
      if (!t) { el.focus(); return; }
      this.disabled = true;
      try {
        var draftBody = JSON.stringify({ code: p.code, publicCommentDraft: t });
        if (userToken) {
          await j('/api/me/arrival-drafts', { method: 'PUT', headers: accountHeaders(), body: draftBody });
        } else {
          var guest = await guestToken();
          await j('/api/guest/arrival-draft', { method: 'POST',
            headers: { 'Content-Type': 'application/json', 'X-Guest-Token': guest }, body: draftBody });
        }
        el.value = '';
        document.getElementById('cmhint').textContent = userToken ? '账号草稿已保存，发布前仍可修改' : '草稿已保存；注册 / 登录后可署名发布';
        if (userToken) showPublishAction();
      } catch (e) {
        document.getElementById('cmhint').textContent = '发布失败：' + String(e.message).slice(0, 80);
      } finally { this.disabled = false; }
    };
    document.getElementById('privateSave').onclick = async function () {
      var el = document.getElementById('privateNote'), note = el.value.trim();
      if (!note) { el.focus(); return; }
      this.disabled = true;
      try {
        var privateBody = JSON.stringify({ code: p.code, privateNote: note });
        if (userToken) {
          await j('/api/me/arrival-drafts', { method: 'PUT', headers: accountHeaders(), body: privateBody });
        } else {
          var guest = await guestToken();
          await j('/api/guest/arrival-draft', { method: 'POST',
            headers: { 'Content-Type': 'application/json', 'X-Guest-Token': guest }, body: privateBody });
        }
        document.getElementById('privateHint').textContent = userToken ? '私人纪念已保存到账号，不会公开' : '私人纪念已保存到游客记录';
        el.value = '';
      } catch (e) {
        document.getElementById('privateHint').textContent = '保存失败：' + String(e.message).slice(0, 80);
      } finally { this.disabled = false; }
    };
    var authMode = 'register';
    var accountBox = document.getElementById('accountBox');
    document.getElementById('accountPrompt').onclick = function () {
      accountBox.style.display = accountBox.style.display === 'none' ? 'block' : 'none';
    };
    function setAuthMode(mode) {
      authMode = mode;
      var isRegister = mode === 'register';
      var registerButton = document.getElementById('registerMode');
      var loginButton = document.getElementById('loginMode');
      registerButton.setAttribute('aria-pressed', String(isRegister));
      loginButton.setAttribute('aria-pressed', String(!isRegister));
      registerButton.className = isRegister ? 'btn coral' : 'btn ghost';
      loginButton.className = isRegister ? 'btn ghost' : 'btn coral';
      document.getElementById('authEmailLabel').style.display = isRegister ? 'block' : 'none';
      document.getElementById('authEmail').style.display = isRegister ? 'block' : 'none';
      document.getElementById('authNicknameLabel').style.display = isRegister ? 'block' : 'none';
      document.getElementById('authNickname').style.display = isRegister ? 'block' : 'none';
      document.getElementById('authPassword').setAttribute('autocomplete', isRegister ? 'new-password' : 'current-password');
      document.getElementById('authSubmit').textContent = isRegister ? '创建账号并合并记录' : '登录并合并记录';
    }
    document.getElementById('registerMode').onclick = function () { setAuthMode('register'); };
    document.getElementById('loginMode').onclick = function () { setAuthMode('login'); };
    document.getElementById('authSubmit').onclick = async function () {
      var btn = this, message = document.getElementById('authMessage');
      var username = document.getElementById('authUsername').value.trim();
      var password = document.getElementById('authPassword').value;
      if (!username || !password) { message.textContent = '请填写用户名和密码'; return; }
      btn.disabled = true;
      message.textContent = '正在安全处理…';
      try {
        var guest = await guestToken();
        var payload = { username: username, password: password };
        if (authMode === 'register') {
          payload.email = document.getElementById('authEmail').value.trim() || null;
          payload.nickname = document.getElementById('authNickname').value.trim() || null;
        }
        var result = await j('/api/auth/' + authMode, { method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-Guest-Token': guest },
          body: JSON.stringify(payload) });
        userToken = result.token;
        try {
          localStorage.setItem('hikes.auth.token', userToken);
          localStorage.removeItem('hikes.guest.token');
        } catch (e) { }
        message.textContent = '已登录，' + result.mergedVisits + ' 条到访与 ' + result.mergedDrafts + ' 条草稿已合并；仍在当前点位。';
        document.getElementById('accountPrompt').textContent = '账号已连接';
        document.getElementById('authUsername').disabled = true;
        document.getElementById('authPassword').disabled = true;
        document.getElementById('authEmail').disabled = true;
        document.getElementById('authNickname').disabled = true;
        btn.style.display = 'none';
        document.getElementById('registerMode').style.display = 'none';
        document.getElementById('loginMode').style.display = 'none';
        await loadAccountDraft();
        await loadComments();
      } catch (e) {
        message.textContent = String(e.message).slice(0, 180);
      } finally { btn.disabled = false; }
    };
    document.getElementById('publishDraft').onclick = async function () {
      if (!userToken) return;
      this.disabled = true;
      try {
        await j('/api/me/arrival-drafts/' + encodeURIComponent(p.code) + '/publish', {
          method: 'POST', headers: accountHeaders()
        });
        document.getElementById('cmhint').textContent = '留言已署名发布';
        document.getElementById('publishDraft').style.display = 'none';
        await loadComments();
      } catch (e) {
        document.getElementById('cmhint').textContent = '发布失败：' + String(e.message).slice(0, 120);
      } finally { this.disabled = false; }
    };
    if (userToken) {
      document.getElementById('accountPrompt').textContent = '账号已连接 · 记录可跨设备保存';
      accountBox.style.display = 'block';
      document.getElementById('authSubmit').style.display = 'none';
      document.getElementById('registerMode').style.display = 'none';
      document.getElementById('loginMode').style.display = 'none';
      document.getElementById('authMessage').textContent = '已登录。私人纪念仅自己可见，留言发布前仍可修改。';
      setAuthMode('login');
    }
    await loadComments();
    fetch('/api/events', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: 'app_open', props: { code: code } }) }).catch(function () { });
  } catch (e) {
    v.innerHTML = '<div class="errbox"><b>加载失败</b><br>' + esc(e.message) +
      '<br><br>先跑一次种子：<br><code>docker compose exec api python /srv/seeds/seed.py</code></div>';
  }
})();
</script>
<script src="/nav.js"></script>
</body>
</html>
