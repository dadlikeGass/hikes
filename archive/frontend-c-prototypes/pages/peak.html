<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>山头页（打卡点） · 到此一游</title>
<link rel="stylesheet" href="/design.css">
<link rel="stylesheet" href="/pages/page.css">
<script src="guard.js"></script>
</head>
<body>
<div class="pagewrap">
<div class="phone" id="phone-mountain">
      <div class="statusbar"><span>8:10</span><span class="icons"><i style="width:15px;height:8px"></i><i style="width:11px;height:8px;border-radius:50% 50% 0 0"></i><i style="width:20px;height:9px;border-radius:3px"></i></span></div>
      <div class="arrive-top scene" style="height:172px">
        <i class="sun"></i>
        <div class="nav-top"><span class="pill">‹ 返回</span><span class="pill">山头 · 打卡点</span></div>
      </div>
      <div class="sheet">
        <h2 class="arrive-h" style="margin-top:2px">青山顶</h2>
        <p class="arrive-p">海拔 1660 m · 属于「青山山脊环线」· 近 30 天 486 人到访</p>

        <div class="sec-head"><h3>用时榜</h3><span>今日 · 好友 · 我的纪录 ›</span></div>
        <div class="card" style="padding:8px 16px 14px;margin-bottom:16px">
          <div class="rank p1"><span class="pos">1</span><span class="av a4">野</span><span class="nm"><b>小野</b><em>今天 08:26</em></span><span class="tm">01:12</span></div>
          <div class="rank"><span class="pos">2</span><span class="av a1">楠</span><span class="nm"><b>阿楠</b><em>今天 09:03</em></span><span class="tm">01:28</span></div>
          <div class="rank me"><span class="pos">3</span><span class="av a3">我</span><span class="nm"><b>你</b><em>今天 09:41 · 个人最好</em></span><span class="tm">01:42</span></div>
          <div class="safehint">共 37 人今日登顶 · 请以安全返程为第一目标</div>
        </div>

        <div class="sec-head"><h3>山顶照片墙</h3><span>214 张 ›</span></div>
        <div class="photowall">
          <div class="scene"><i class="sun" style="left:6px;top:8px;width:0;height:0"></i></div>
          <div class="scene" style="filter:saturate(1.2)"><i class="sun" style="left:8px;top:10px;width:0;height:0"></i></div>
          <div class="scene cool"><i class="sun" style="left:8px;top:10px;width:0;height:0"></i></div>
        </div>

        <div class="sec-head"><h3>留言板</h3><span>全部 ›</span></div>
        <div class="comment">
          <div class="ph"><span class="av a1" style="width:22px;height:22px;font-size:10px">川</span>阿川 · 3 小时前</div>
          <p>登顶打卡第 100 位，是我！</p>
        </div>
        <div class="comment">
          <div class="ph"><span class="av a3" style="width:22px;height:22px;font-size:10px">鱼</span>小鱼 · 昨天</div>
          <p>第一次一个人上山，有点怕，但真的好看。</p>
        </div>

        <div style="display:flex;gap:9px;margin-top:16px">
          <button class="btn ghost" style="margin:0;font-size:14px;padding:12px">收藏到想去</button>
          <button class="btn coral" style="font-size:14px;padding:12px">我也到了</button>
        </div>
      </div>
      <nav class="tabbar">
        <a><svg class="ico" viewBox="0 0 24 24"><path d="M4 4.5h7v7H4zM13 4.5h7v7h-7zM4 13.5h7v6H4zM13 13.5h7v6h-7z"/></svg>路书</a>
        <a class="on"><svg class="ico" viewBox="0 0 24 24"><path d="M2 19.5 9 6.5l3.6 6.2 2.2-3.4 7.2 10.2z"/></svg>山头·岔路</a>
        <a class="scan"><span class="scan-btn"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.9" stroke-linecap="round"><path d="M4 9V5.6A1.6 1.6 0 0 1 5.6 4H9"/><path d="M15 4h3.4A1.6 1.6 0 0 1 20 5.6V9"/><path d="M20 15v3.4a1.6 1.6 0 0 1-1.6 1.6H15"/><path d="M9 20H5.6A1.6 1.6 0 0 1 4 18.4V15"/><rect x="10" y="10" width="4" height="4" rx="1.2"/></svg></span><em>扫一扫</em></a>
        <a><svg class="ico" viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 21l1.9-5.4A8 8 0 1 1 21 12z"/></svg>消息</a>
        <a><svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.6"/><path d="M4.8 20c1.3-3.6 4-5.4 7.2-5.4s5.9 1.8 7.2 5.4"/></svg>我</a>
      </nav>
</div>
</body>
</html>
