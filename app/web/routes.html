<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>路书 · 到此一游</title>
<link rel="stylesheet" href="/theme/app.css">
<script src="guard.js"></script>
<style>
body{background:#E7E1D6}
.wrap{max-width:430px;margin:0 auto;background:var(--bg);min-height:100dvh;padding-bottom:30px}
.rc{display:block;background:#fff;border-radius:20px;padding:15px;box-shadow:var(--shadow);
  margin-bottom:12px;color:inherit}
.rc .hd{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.rc h3{font-size:16.5px;font-weight:800;letter-spacing:-.3px;line-height:1.3}
.rc .sub{font-size:11.5px;color:var(--ink3);margin-top:2px}
.rc .mt{display:flex;gap:14px;margin-top:11px;padding-top:11px;border-top:1px solid var(--hair)}
.rc .mt div{flex:1}
.rc .mt span{display:block;font-size:10.5px;color:var(--ink3)}
.rc .mt b{font-size:14px;font-weight:800;font-variant-numeric:tabular-nums}
.rc .mt b.cal{color:var(--coral)}
.hardline{display:flex;align-items:center;gap:7px;margin-top:10px;font-size:11.5px;color:var(--ink2)}
.sq{width:9px;height:9px;border-radius:3px;flex:0 0 auto}
.skel{background:linear-gradient(90deg,#EFEAE0,#F7F3EC,#EFEAE0);border-radius:12px;height:104px;margin-bottom:12px}
.trk2{background:#fff;border-radius:18px;padding:12px;box-shadow:var(--shadow);margin-bottom:12px}
.trk2 svg{display:block;width:100%;height:210px}
.segline{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--hair);font-size:12px}
.segline:last-child{border-bottom:none}
.backb{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--blue);
  padding:14px 16px 6px}
.searchbar{display:flex;align-items:center;gap:9px;background:#fff;border-radius:14px;padding:12px 15px;
  box-shadow:var(--shadow);margin-bottom:12px}
.searchbar input{flex:1;border:none;outline:none;background:none;font:inherit;font-size:14px;min-width:0}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:6px}
.chip{font-size:12.5px;font-weight:700;padding:8px 14px;border-radius:999px;background:#fff;
  color:var(--ink2);box-shadow:var(--shadow);white-space:nowrap;display:inline-flex;align-items:center;
  gap:6px;border:none;font-family:inherit}
.chip.on{background:var(--ink);color:#fff}
.chip .lvshape{width:11px;height:11px}
.rankrow{display:flex;gap:11px;overflow-x:auto;margin:0 -16px;padding:2px 16px 12px}
.rcard{flex:0 0 186px;background:#fff;border-radius:16px;padding:13px;box-shadow:var(--shadow);color:inherit}
.rcard h4{font-size:14px;font-weight:800;line-height:1.3;margin:8px 0 7px}
.rcard .m{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;color:var(--ink2);padding:2.5px 0}
.rcard .m b{font-weight:800;font-variant-numeric:tabular-nums;color:var(--ink)}
.rcard .m b.hi{color:var(--coral)}
.fold{background:#fff;border-radius:16px;box-shadow:var(--shadow);overflow:hidden;margin-top:4px}
.fold summary{padding:15px 16px;font-size:14px;font-weight:800;cursor:pointer;list-style:none}
.fold summary::-webkit-details-marker{display:none}
.fold summary::after{content:'＋';float:right;color:var(--ink3);font-weight:400}
.fold[open] summary::after{content:'－'}
.fold .bd{padding:0 16px 16px;font-size:12.5px;color:#3C3F4E;line-height:1.75}
.fold .bd b{color:var(--ink)}
.rankhd{display:flex;justify-content:space-between;align-items:baseline;margin:16px 2px 9px}
.rankhd h3{font-size:15.5px;font-weight:800}
.rankhd span{font-size:11.5px;color:var(--ink3)}
.rankhd .seeall{border:none;background:none;font:inherit;font-size:12.5px;font-weight:700;
  color:var(--blue);padding:2px 0;font-family:inherit}
.rankhd small{font-size:11.5px;color:var(--ink3);font-weight:400;margin-left:6px}
.rlrow{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--hair);
  color:inherit}
.rlrow:last-child{border-bottom:none}
.rlno{width:18px;text-align:center;font-size:12.5px;font-weight:800;color:#B8B3A6;flex:0 0 auto}
.rlnm{flex:1;min-width:0}
.rlnm b{display:block;font-size:14px}
.rlnm em{font-style:normal;font-size:11.5px;color:var(--ink3)}
.entryrow{display:flex;align-items:center;gap:12px;width:100%;background:#fff;border:none;
  border-radius:16px;padding:15px 16px;margin-top:11px;box-shadow:var(--shadow);font-family:inherit;
  color:inherit;text-align:left}
.entryrow .em{font-size:18px;width:24px;text-align:center;color:var(--blue);flex:0 0 auto}
.entryrow .tx b{display:block;font-size:14px}
.entryrow .tx span{font-size:11.5px;color:var(--ink3)}
.hero4{height:210px;position:relative;overflow:hidden}
.hero4>svg{display:block;width:100%;height:100%}
.hero4 .scrim{position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,
  rgba(16,14,32,.60) 0%,rgba(16,14,32,.22) 45%,rgba(16,14,32,0) 68%,rgba(16,14,32,.52) 100%)}
.hero4 .ovl{position:absolute;z-index:2}
.hero4 .ovl.tl{left:16px;right:58px;bottom:14px;color:#fff}
.hero4 .ovl.tl h2{font-size:23px;font-weight:900;letter-spacing:-.6px;
  text-shadow:0 2px 10px rgba(12,10,26,.6)}
.hero4 .ovl.tl .st{font-size:12px;color:rgba(255,255,255,.9);margin-top:3px;
  text-shadow:0 1px 6px rgba(12,10,26,.6)}
.hero4 .ovl.br{right:14px;top:12px}
.note{font-size:11.5px;color:var(--ink3);line-height:1.7}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar home" style="padding:16px">
    <span class="brand"><b>路书</b><em>TRAILBOOK</em></span>
  </div>
  <div id="view" style="padding:0 16px"></div>
</div>
<script>
var C = { easy: '#2563EB', mid: '#F2B62C', hard: '#E4453A', hidden: '#22242E' };
var N = { easy: '简单', mid: '中等', hard: '困难', hidden: '隐藏' };
var KIND = { climb: '爬升', desc: '下降', flat: '平缓' };
var SH = {
  easy: function (c) { return '<circle cx="50" cy="50" r="41" fill="' + c + '"/>'; },
  mid: function (c) { return '<polygon points="50,10 92,87 8,87" fill="' + c + '"/>'; },
  hard: function (c) { return '<polygon points="50,6 94,50 50,94 6,50" fill="' + c + '"/>'; },
  hidden: function (c) { return '<polygon points="50,5 89,27 89,73 50,95 11,73 11,27" fill="' + c + '"/>'; }
};
function badge(lv, txt) {
  var c = C[lv] || '#22242E';
  return '<span class="badge" style="background:' + c + '22;color:' + c + '">' +
    '<span class="lvmark"><span class="lvshape"><svg viewBox="0 0 100 100">' +
    SH[lv](c) + '</svg></span>' + (txt || N[lv]) + '</span></span>';
}
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
  return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
/* 山景插画：按 slug 确定性生成，同一线路永远同一张图 */
function scene(seed) {
  var h = 0; for (var i = 0; i < seed.length; i++) h = (h * 31 + seed.charCodeAt(i)) % 997;
  var pal = [['#FFE9C8', '#FFD09A', '#F4A97E', '#C4869A', '#6E6394'],
    ['#EAF2F8', '#D3E2EC', '#AEC3D6', '#8897B2', '#5E6C8C'],
    ['#EDF4E7', '#D6E7CC', '#B2CCA4', '#89A87E', '#628067'],
    ['#FFDCC6', '#F5AE93', '#CE8189', '#8E5F80', '#4E3D66']][h % 4];
  var u = 'g' + h, o = '<svg viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice">';
  o += '<defs><linearGradient id="' + u + '" x1="0" y1="0" x2="0" y2="1">';
  pal.forEach(function (c, i) { o += '<stop offset="' + (i * 25) + '%" stop-color="' + c + '"/>'; });
  o += '</linearGradient></defs><rect width="400" height="300" fill="url(#' + u + ')"/>';
  o += '<circle cx="' + (90 + h % 200) + '" cy="86" r="24" fill="#FFE0A0" opacity=".9"/>';
  o += '<path d="M0 300 L0 175 L70 118 L140 188 L210 128 L290 198 L400 148 L400 300Z" fill="#524C72" opacity=".85"/>';
  o += '<path d="M0 300 L0 228 L90 188 L180 243 L280 193 L400 248 L400 300Z" fill="#33304A"/>';
  return o + '</svg>';
}
function trackSVG(path, segs, km, peaks) {
  var W = 380, H = 210, pad = 26, xs = [], ys = [];
  path.forEach(function (p) { xs.push(p[0]); ys.push(p[1]); });
  var x0 = Math.min.apply(null, xs), x1 = Math.max.apply(null, xs);
  var y0 = Math.min.apply(null, ys), y1 = Math.max.apply(null, ys);
  var s = Math.min((W - pad * 2) / ((x1 - x0) || 1), (H - pad * 2) / ((y1 - y0) || 1));
  var ox = (W - (x1 - x0) * s) / 2, oy = (H - (y1 - y0) * s) / 2;
  function P(i) { return [(xs[i] - x0) * s + ox, (ys[i] - y0) * s + oy]; }
  var n = path.length - 1, o = '<svg viewBox="0 0 ' + W + ' ' + H + '">';
  o += '<g fill="none" stroke="#EFEADD" stroke-width="1">';
  [40, 78, 116, 154, 192].forEach(function (y) { o += '<path d="M0 ' + y + ' q 70 -12 140 0 t 200 0"/>'; });
  o += '</g>';
  segs.forEach(function (sg) {
    var a = Math.round(sg.from_km / km * n), b = Math.round(sg.to_km / km * n), d = '';
    for (var i = a; i <= b; i++) { var q = P(i); d += (i === a ? 'M' : 'L') + q[0].toFixed(1) + ' ' + q[1].toFixed(1); }
    o += '<path d="' + d + '" fill="none" stroke="' + (C[sg.level] || '#888') +
      '" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>';
  });
  (peaks || []).forEach(function (p) {
    var q = P(Math.round(p.km / km * n));
    o += '<circle cx="' + q[0].toFixed(1) + '" cy="' + q[1].toFixed(1) + '" r="6.5" fill="#22242E"/>' +
      '<text x="' + q[0].toFixed(1) + '" y="' + (q[1] - 11).toFixed(1) + '" text-anchor="middle" ' +
      'font-size="10.5" font-weight="700" fill="#22242E">' + p.altitude + '</text>';
  });
  return o + '</svg>';
}
async function j(u, o) { var r = await fetch(u, o); if (!r.ok) throw new Error(r.status); return r.json(); }

/* 海拔剖面 + 底部难度色带 */
function profileSVG(prof, segs, km) {
  var W = 340, H = 96, pad = 8, n = prof.length;
  var xs = [], ys = [];
  for (var i = 0; i < n; i++) {
    xs.push(pad + (i / (n - 1)) * (W - pad * 2));
    ys.push(H - 16 - prof[i] * (H - 30));
  }
  var line = xs.map(function (x, i) { return (i ? 'L' : 'M') + x.toFixed(1) + ' ' + ys[i].toFixed(1); }).join(' ');
  var area = line + ' L' + xs[n - 1].toFixed(1) + ' ' + (H - 12) + ' L' + xs[0].toFixed(1) + ' ' + (H - 12) + ' Z';
  var o = '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" style="height:74px;width:100%;display:block">';
  o += '<path d="' + area + '" fill="#EDF1FD"/>';
  o += '<path d="' + line + '" fill="none" stroke="#3455F5" stroke-width="2" stroke-linejoin="round"/>';
  segs.forEach(function (s) {
    var x0 = pad + (s.from_km / km) * (W - pad * 2), x1 = pad + (s.to_km / km) * (W - pad * 2);
    o += '<rect x="' + x0.toFixed(1) + '" y="' + (H - 10) + '" width="' +
      Math.max(1, x1 - x0).toFixed(1) + '" height="7" fill="' + (C[s.level] || '#999') + '"/>';
  });
  return o + '</svg>';
}
var view = document.getElementById('view');

var TIP = {
  easy: '缓坡林道 · 2–3 小时 · 适合第一次上山',
  mid: '持续爬升或较长距离 · 需要一定体力',
  hard: '长距离或复杂地形 · 建议预留整日',
  hidden: '需要绳索冰爪等保护措施 · 由山友与维护人确认'
};
var ALL = [], Q = '', LV = 'all', GROUP = '';

function bigCard(r) {
  return '<a class="rc" href="#' + r.slug + '">' +
    '<div class="hd"><div><h3>' + esc(r.name) + '</h3>' +
    (r.sub ? '<div class="sub">' + esc(r.sub) + '</div>' : '') + '</div>' +
    badge(r.hardest_level) + '</div>' +
    '<div class="mt">' +
    '<div><span>距离</span><b>' + r.km + ' km</b></div>' +
    '<div><span>爬升</span><b>' + r.up + ' m</b></div>' +
    '<div><span>平均用时</span><b>' + (r.hours || '—') + ' h</b></div>' +
    '<div><span>消耗</span><b class="cal">' + (r.kcal || '—') + '</b></div>' +
    '</div>' +
    '<div class="hardline"><span class="sq" style="background:' + C[r.hardest_level] + '"></span>' +
    '最难段 ' + N[r.hardest_level] + ' · ' + r.peak_count + ' 个山顶 · ' +
    r.segment_count + ' 个分段</div></a>';
}

function miniCard(r, k, v) {
  return '<a class="rcard" href="#' + r.slug + '">' + badge(r.hardest_level) +
    '<h4>' + esc(r.name) + '</h4>' +
    '<div class="m"><span>距离</span><b>' + r.km + ' km</b></div>' +
    '<div class="m"><span>爬升</span><b>' + r.up + ' m</b></div>' +
    '<div class="m"><span>' + k + '</span><b class="hi">' + v(r) + '</b></div></a>';
}

/* 竖排列表行：序号 · 线路名 · 距离爬升 · 难度（设计稿里榜单的形态） */
function rankRow(r, i) {
  return '<a class="rlrow" href="#' + r.slug + '">' +
    '<span class="rlno">' + i + '</span>' +
    '<span class="rlnm"><b>' + esc(r.name) + '</b>' +
    '<em>' + r.km + ' km · ↗ ' + r.up + ' m</em></span>' +
    badge(r.hardest_level) + '</a>';
}

function rankGroups() {
  var g = [];
  /* 唯一横滑的一栏 —— 设计稿里只有「热门线路最快记录」是横滑的 */
  var fast = ALL.filter(function (r) { return r.fastest_time; })
    .sort(function (a, b) { return a.fastest_time.localeCompare(b.fastest_time); });
  if (fast.length) {
    g.push('<div class="rankhd"><h3>热门线路最快记录</h3>' +
      '<button class="seeall" data-g="热门线路最快记录">看全部 ›</button></div>' +
      '<div class="rankrow">' + fast.map(function (r) {
        return miniCard(r, '最快', function (x) { return x.fastest_time; }); }).join('') + '</div>');
  }
  /* 口径说明（设计稿里的蓝底卡） */
  g.push('<div class="card" style="background:var(--blue-bg);box-shadow:none;padding:13px 15px;' +
    'font-size:12.5px;color:#2A3A9E;margin:2px 0 6px">' +
    '<b>口径</b>　用时只在同一条线路上比较，每条线路各自成榜；跨线路不排名。</div>');

  g.push('<div class="rankhd"><h3>新手小白线路<small>平缓 · 3 小时内</small></h3>' +
    '<button class="seeall" data-g="新手小白线路">看全部 ›</button></div>' +
    '<div class="card tight">' + ALL.slice().sort(function (a, b) { return a.hours - b.hours; })
      .slice(0, 3).map(function (r, i) { return rankRow(r, i + 1); }).join('') + '</div>');

  var hard = ALL.filter(function (r) {
    return r.hardest_level === 'hard' || r.hardest_level === 'hidden'; })
    .sort(function (a, b) { return b.up - a.up; });
  if (hard.length) {
    g.push('<div class="rankhd"><h3>最难的线路</h3>' +
      '<button class="seeall" data-g="最难的线路">看全部 ›</button></div>' +
      '<div class="card tight">' + hard.slice(0, 3).map(function (r, i) {
        return rankRow(r, i + 1); }).join('') + '</div>');
  }
  g.push('<div class="rankhd"><h3>最长的线路</h3>' +
    '<button class="seeall" data-g="最长的线路">看全部 ›</button></div>' +
    '<div class="card tight">' + ALL.slice().sort(function (a, b) { return b.km - a.km; })
      .slice(0, 3).map(function (r, i) { return rankRow(r, i + 1); }).join('') + '</div>');

  /* 两个入口行（设计稿：＋ 本周新增路线 ／ ? 难度分级怎么定的） */
  g.push('<button class="entryrow"><span class="em">＋</span>' +
    '<span class="tx"><b>本周新增路线</b><span>由山友共建 · 查看</span></span></button>');
  g.push('<button class="entryrow" id="docbtn"><span class="em">?</span>' +
    '<span class="tx"><b>难度分级怎么定的</b>' +
    '<span>形状 + 颜色 · 中美瑞对照</span></span></button>');
  return g.join('');
}

function renderList() {
  var rank = document.getElementById('rankbox');
  if (!rank) return;
  /* 默认只出榜单（文档：搜索 → 筛选 → 各榜单横滑 → 关于难度 → 底部说明，没有"全部线路"）
     只有在搜索、筛难度、或点了「看全部」时才出列表。 */
  if (Q || LV !== 'all' || GROUP) {
    var f = ALL.filter(function (r) {
      var inGroup = !GROUP ||
        (GROUP === '新手小白线路') ||
        (GROUP === '最难的线路' && (r.hardest_level === 'hard' || r.hardest_level === 'hidden')) ||
        (GROUP === '最长的线路') ||
        (GROUP === '热门线路最快记录' && r.fastest_time);
      return inGroup && (LV === 'all' || r.hardest_level === LV) &&
        (!Q || r.name.indexOf(Q) >= 0 || (r.sub || '').indexOf(Q) >= 0);
    });
    if (GROUP === '新手小白线路') f.sort(function (a, b) { return a.hours - b.hours; });
    if (GROUP === '最长的线路') f.sort(function (a, b) { return b.km - a.km; });
    if (GROUP === '最难的线路') f.sort(function (a, b) { return b.up - a.up; });
    rank.innerHTML = '<div class="rankhd"><h3>' + (GROUP || '筛选结果') + '</h3>' +
      '<button class="seeall back" data-g="">‹ 回榜单</button></div>' +
      (f.length ? f.map(bigCard).join('')
        : '<div class="card" style="text-align:center;color:var(--ink3);padding:30px 16px">没有匹配的线路</div>');
  } else {
    rank.innerHTML = rankGroups();
  }
}

async function list() {
  view.innerHTML = '<div class="skel"></div><div class="skel"></div><div class="skel"></div>';
  ALL = (await j('/api/routes?limit=50')).items;
  view.innerHTML =
    '<div class="searchbar">🔍<input id="q" placeholder="搜索线路名称或目的地"></div>' +
    '<div class="chips" id="chips">' +
    [['all', '全部'], ['easy', '简单'], ['mid', '中等'], ['hard', '困难'], ['hidden', '隐藏']]
      .map(function (c) {
        return '<button class="chip' + (c[0] === 'all' ? ' on' : '') + '" data-lv="' + c[0] + '">' +
          (c[0] === 'all' ? '全部' : badge(c[0])) + '</button>';
      }).join('') + '</div>' +
    '<div class="hint" style="margin:0 2px 10px">难度徽标只代表<strong>这条线路里最难的那一段</strong>，' +
    '不代表整条线路。用时与消耗是估算。</div>' +
    '<div id="rankbox"></div>' +            /* 榜单（或筛选结果）—— 文档顺序排在第三 */
    '<div id="docbox" hidden><div class="rankhd" style="margin-top:16px">' +
    '<h3>关于难度</h3><span>形状 + 颜色</span></div>' +
    '<div class="card">' +
    ['easy', 'mid', 'hard', 'hidden'].map(function (k) {
      return '<div style="display:flex;gap:12px;align-items:center;padding:9px 0">' +
        '<span class="lvshape" style="width:34px;height:34px;flex:0 0 auto">' +
        '<svg viewBox="0 0 100 100">' + SH[k](C[k]) + '</svg></span>' +
        '<span style="flex:1"><b style="font-size:13.5px">' + N[k] + '</b>' +
        '<span style="display:block;font-size:11.5px;color:var(--ink3)">' + TIP[k] + '</span></span></div>';
    }).join('') +
    '<div class="note" style="padding-top:10px;margin-top:6px;border-top:1px solid var(--hair)">' +
    '段难度只看<strong>爬升高度</strong>与<strong>平均坡度</strong>：爬升 ≤200/200–500/&gt;500 m，' +
    '坡度 ≤15/15–25%/&gt;25%。距离不进难度——它体现在用时与消耗里。' +
    '是否要手脚并用、是否需要绳索冰爪，由山友和维护人确认。</div></div>' +
    '<details class="fold"><summary>别的地方怎么分级</summary><div class="bd">' +
    '<p><b>美国 · 国家公园</b>　Easy / Moderate / Strenuous 三档，只看距离与累计爬升，' +
    '不看技术动作。和我们的思路最接近。</p>' +
    '<p><b>美国 · YDS</b>　Class 1–5 描述"手要不要用"。徒步在 Class 1–3；' +
    'Class 4 开始需要手脚并用并承担坠落风险；Class 5 进入需要绳索与确保的攀岩。' +
    '我们的隐藏档对应 Class 4 以上。</p>' +
    '<p><b>瑞士 · SAC</b>　T1–T6，颜色直接印在实体路标上：T1 徒步道（黄）、' +
    'T2–T3 山地步道（红）、T4–T6 高山步道（蓝）。和我们用形状区分是同一个思路。</p>' +
    '</div></details></div>' +
    '<div class="hint" style="text-align:center;margin-top:14px">' +
    '用时与消耗为估算 · 线路数据来自真实 GPX</div>';

  var q = document.getElementById('q');
  q.value = Q;
  q.addEventListener('input', function () { Q = this.value.trim(); renderList(); });
  document.getElementById('chips').addEventListener('click', function (e) {
    var b = e.target.closest('.chip'); if (!b) return;
    LV = b.dataset.lv; GROUP = '';
    document.querySelectorAll('#chips .chip').forEach(function (x) {
      x.classList.toggle('on', x === b); });
    renderList();
  });
  document.getElementById('rankbox').addEventListener('click', function (e) {
    if (e.target.closest('#docbtn')) {
      var db = document.getElementById('docbox');
      db.hidden = !db.hidden;
      if (!db.hidden) db.scrollIntoView({ behavior: 'smooth', block: 'start' });
      return;
    }
    var b = e.target.closest('.seeall'); if (!b) return;
    GROUP = b.dataset.g || '';
    if (GROUP) {
      Q = ''; LV = 'all';
      document.getElementById('q').value = '';
      document.querySelectorAll('#chips .chip').forEach(function (x) {
        x.classList.toggle('on', x.dataset.lv === 'all'); });
    }
    renderList();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
  renderList();
}

async function detail(slug) {
  view.innerHTML = '<div class="skel" style="height:200px"></div>';
  var r = await j('/api/routes/' + slug);
  var est = r.est || {};
  var h = r.hardest || {};
  var top = r.peaks.length ? Math.max.apply(null, r.peaks.map(function (p) { return p.altitude; })) : 0;
  var hardestRow = r.segments.filter(function (s) { return s.level === r.hardest_level; })[0] || r.segments[0];
  view.innerHTML =
    '<a class="backb" href="#">‹ 全部线路</a>' +
    /* ① 大图 */
    '<div class="hero4" style="margin:0 -16px 14px">' + scene(r.slug) +
    '<div class="scrim"></div>' +
    '<div class="ovl tl"><h2>' + esc(r.name) + '</h2>' +
    (r.sub ? '<div class="st">' + esc(r.sub) + '</div>' : '') + '</div>' +
    '<div class="ovl br">' + badge(r.hardest_level) + '</div></div>' +
    /* ② 名称 + 距离 / 爬升 / 下降 + 山顶数 */
    '<div class="card" style="padding:14px">' +
    '<div style="display:flex;gap:12px">' +
    ['距离|' + r.km + ' km', '爬升|' + r.up + ' m', '下降|' + r.down + ' m',
      '山顶|' + r.peaks.length + ' 个'].map(function (x) {
      var a = x.split('|');
      return '<div style="flex:1"><span style="display:block;font-size:10.5px;color:var(--ink3)">' +
        a[0] + '</span><b style="font-size:15px;font-variant-numeric:tabular-nums">' + a[1] + '</b></div>';
    }).join('') + '</div>' +
    '<div style="display:flex;gap:12px;margin-top:13px;padding-top:13px;border-top:1px solid var(--hair)">' +
    '<div style="flex:1"><span style="display:block;font-size:10.5px;color:var(--ink3)">平均用时</span>' +
    '<b style="font-size:17px">' + r.hours + ' h</b></div>' +
    '<div style="flex:1"><span style="display:block;font-size:10.5px;color:var(--ink3)">大致消耗</span>' +
    '<b style="font-size:17px;color:var(--coral)">' + r.kcal + '</b></div></div></div>' +
    /* ③ 难度判定卡 */
    '<div class="rankhd"><h3>难度判定</h3><span>爬升 + 坡度</span></div>' +
    '<div class="card" style="background:var(--blue-bg);box-shadow:none">' +
    '<div style="font-size:12px;font-weight:800;color:var(--blue);margin-bottom:8px">' +
    '整条线路不做分级，只标最难的那一段</div>' +
    (hardestRow ? '<div class="kv" style="display:flex;justify-content:space-between;font-size:13px;padding:5px 0">' +
      '<span style="color:var(--blue-deep)">最难段</span><b>第 ' + hardestRow.no + ' 段 · ' +
      hardestRow.from_km + '–' + hardestRow.to_km + ' km</b></div>' +
      '<div class="kv" style="display:flex;justify-content:space-between;font-size:13px;padding:5px 0">' +
      '<span style="color:var(--blue-deep)">爬升 / 坡度</span><b>+' + hardestRow.rise + ' m · ' +
      '+25%'.replace('25', hardestRow.pct) + '</b></div>' : '') +
    '<div class="kv" style="display:flex;justify-content:space-between;font-size:13px;padding:5px 0">' +
    '<span style="color:var(--blue-deep)">判定结果</span>' + badge(r.hardest_level) + '</div>' +
    '<div class="note" style="margin-top:10px;color:var(--blue-deep)">' +
    '段难度只看<strong>爬升高度</strong>与<strong>平均坡度</strong>；距离不进难度——' +
    '它体现在上面那行的用时与消耗里。是否要手脚并用、是否需要绳索冰爪，由山友和维护人确认。</div></div>' +
    /* ④ 标牌预览 */
    '<div class="rankhd"><h3>实体标牌</h3><span>终点打卡点样式</span></div>' +
    '<div class="card" style="display:flex;gap:15px;align-items:center">' +
    '<span style="width:62px;height:62px;flex:0 0 auto"><svg viewBox="0 0 100 100">' +
    SH[r.hardest_level](C[r.hardest_level]) + '</svg></span>' +
    '<span style="flex:1"><span style="display:block;font-size:10.5px;font-weight:800;' +
    'letter-spacing:1.1px;color:var(--ink2)">DCYY | ' + (top ? top + 'M' : '—') + '</span>' +
    '<span style="display:block;font-size:9.5px;font-weight:700;letter-spacing:1.6px;' +
    'color:var(--ink3);margin-top:4px">I HAVE BEEN HERE</span></span>' +
    '<span style="width:60px;height:60px;border:1px solid var(--line);border-radius:9px;' +
    'display:grid;place-items:center;font-size:9px;color:var(--ink3);text-align:center;' +
    'line-height:1.3">二维码<br>待标定</span></div>' +
    /* ⑤ 按难度着色的轨迹图（山顶标海拔） */
    '<div class="rankhd"><h3>轨迹与难度</h3><span>按段着色</span></div>' +
    '<div class="trk2">' + trackSVG(r.path, r.segments, r.km, r.peaks) + '</div>' +
    /* ⑥ 海拔剖面 + 色带 */
    '<div class="rankhd"><h3>海拔剖面</h3><span>底部色带 = 段的难度</span></div>' +
    '<div class="trk2" style="padding:10px 12px 8px">' + profileSVG(r.profile, r.segments, r.km) + '</div>' +
    '<div class="sec-head"><h3>山顶</h3><span class="more">' + r.peaks.length + ' 个</span></div>' +
    '<div class="card tight">' + r.peaks.map(function (p, i) {
      return '<div class="segline"><span style="font-weight:800;color:var(--ink3);width:16px">' + (i + 1) + '</span>' +
        '<span>⛰</span><span style="flex:1">' + p.km + ' km 处</span>' +
        '<b style="font-variant-numeric:tabular-nums">海拔 ' + p.altitude + ' m</b></div>';
    }).join('') + '</div>' +
    '<div class="sec-head"><h3>分段难度</h3><span class="more">爬升 + 坡度</span></div>' +
    '<div class="card tight">' + r.segments.map(function (s) {
      return '<div class="segline"><span class="sq" style="background:' + C[s.level] + '"></span>' +
        '<span style="font-weight:800;flex:0 0 50px">' + s.no + '. ' + KIND[s.kind] + '</span>' +
        '<span style="color:var(--ink2);flex:0 0 92px">' + s.from_km + '–' + s.to_km + ' km</span>' +
        '<span style="flex:1;color:var(--ink2)">' + (s.rise > 0 ? '+' : '') + s.rise + ' m · ' +
        (s.pct > 0 ? '+' : '') + s.pct + '%</span>' + badge(s.level) + '</div>';
    }).join('') +
    '<div class="note" style="padding:10px 2px 0;font-size:11.5px;color:var(--ink3);line-height:1.6">' +
    '段难度只看<strong>爬升高度</strong>与<strong>平均坡度</strong>：爬升 ≤200/200–500/&gt;500 m，' +
    '坡度 ≤15/15–25/&gt;25%。距离不进难度——它体现在上面的用时与消耗里。' +
    '是否要手脚并用、是否需要绳索冰爪，由山友和维护人确认。</div></div>';
}

function route() {
  var slug = decodeURIComponent(location.hash.replace(/^#/, ''));
  (slug ? detail(slug) : list()).catch(function (e) {
    view.innerHTML = '<div class="card" style="background:var(--coral-bg);box-shadow:none">加载失败：' +
      esc(e.message) + '</div>';
  });
}
window.addEventListener('hashchange', route);
route();
</script>
