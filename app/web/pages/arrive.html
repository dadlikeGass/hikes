<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>扫码到达页 · 山头打卡点 · 到此一游</title>
<link rel="stylesheet" href="/design.css">
<link rel="stylesheet" href="/pages/page.css">
<script src="guard.js"></script>
</head>
<body>
<div class="pagewrap">
<div class="phone">
      <div class="statusbar"><span>9:24</span><span class="icons"><i style="width:15px;height:8px"></i><i style="width:11px;height:8px;border-radius:50% 50% 0 0"></i><i style="width:20px;height:9px;border-radius:3px"></i></span></div>
      <div class="arrive-top scene">
        <i class="sun"></i>
        <div class="nav-top"><span class="pill">‹ 返回</span><span class="pill">青山顶 · ● 简单</span></div>
      </div>
      <div class="sheet">
        <span class="seal">#100</span>
        <h2 class="arrive-h">你到了，山友。</h2>
        <p class="arrive-p">你是第 <b>100</b> 位在青山顶留下痕迹的人</p>
        <button class="btn coral">留下我的到访卡</button>
        <div class="mini3">
          <div><span>首次登顶</span><b>✓</b></div>
          <div><span>本次用时</span><b>01:42</b></div>
          <div><span>山径拼图</span><b>+1</b></div>
        </div>
        <div class="boardline">🏆 本次 <b>01:42</b>　今日第 <b>3</b> 名<span>用时榜 ›</span></div>
        <div class="letter">
          <span class="stampmark"></span>
          <div class="tag">有人给你留了一句话</div>
          <div class="line" style="font-size:15px">来自一位先到的山友　<span style="color:var(--violet)">拆开看看 ›</span></div>
          <div class="sub">118 天前写在这里，等下一个走到这个点位的人</div>
        </div>
        <div class="sec-head" style="margin-top:16px"><h3>青山顶留言板</h3><span>全部 ›</span></div>
        <div class="comment">
          <div class="ph"><span class="av a2" style="width:22px;height:22px;font-size:10px">鱼</span>小鱼 · 2 小时前</div>
          <p>风很大，但真的好温柔！看到日出的一刻，觉得所有的辛苦都值得了 ❤️</p>
        </div>
        <div class="comment">
          <div class="ph"><span class="av a4" style="width:22px;height:22px;font-size:10px">楠</span>阿楠 · 5 小时前</div>
          <p>一个人来，遇到超棒的伙伴，一起看了日出。</p>
        </div>
        <div class="more"><span>写给未来的自己</span><span>求一张合影</span><span>一起走一段</span></div>
      </div>
      <nav class="tabbar">
        <a><svg class="ico" viewBox="0 0 24 24"><path d="M4 4.5h7v7H4zM13 4.5h7v7h-7zM4 13.5h7v6H4zM13 13.5h7v6h-7z"/></svg>路书</a>
        <a class="on"><svg class="ico" viewBox="0 0 24 24"><path d="M2 19.5 9 6.5l3.6 6.2 2.2-3.4 7.2 10.2z"/></svg>山头·岔路</a>
        <a class="scan"><span class="scan-btn"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.9" stroke-linecap="round"><path d="M4 9V5.6A1.6 1.6 0 0 1 5.6 4H9"/><path d="M15 4h3.4A1.6 1.6 0 0 1 20 5.6V9"/><path d="M20 15v3.4a1.6 1.6 0 0 1-1.6 1.6H15"/><path d="M9 20H5.6A1.6 1.6 0 0 1 4 18.4V15"/><rect x="10" y="10" width="4" height="4" rx="1.2"/></svg></span><em>扫一扫</em></a>
        <a><svg class="ico" viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 21l1.9-5.4A8 8 0 1 1 21 12z"/></svg>消息</a>
        <a><svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.6"/><path d="M4.8 20c1.3-3.6 4-5.4 7.2-5.4s5.9 1.8 7.2 5.4"/></svg>我</a>
      </nav>
</div>
<script src="/pages/arrive.js"></script>
</body>
</html>
