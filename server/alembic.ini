# 迁移配置。连接串不写在这里：env.py 一律从 DATABASE_URL 环境变量读，
# 和 server/app/main.py 用同一个变量，避免两处配置漂移。
#
# 在容器里跑（工作目录 /srv）：
#   docker compose exec api alembic current
#   docker compose exec api alembic upgrade head

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
